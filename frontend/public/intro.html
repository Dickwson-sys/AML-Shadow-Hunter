<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow-TX Hunter</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@300;400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--void:#05070a;--green:#5dcaa5;--red:#ff2d5a;--white:#f0f5fb;--slate:#8ba0b4}
html,body{width:100%;height:100%;background:var(--void);overflow:hidden;cursor:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#bg{position:absolute;inset:0;width:100%;height:100%}

/* Scanline overlay */
#scanlines{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);animation:scanMove 8s linear infinite}
@keyframes scanMove{0%{background-position:0 0}100%{background-position:0 100px}}

#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 30%,rgba(2,3,5,0.7) 80%,rgba(1,2,4,0.95) 100%);pointer-events:none}
#text-panel{position:absolute;left:6%;top:50%;transform:translateY(-50%);width:220px;z-index:10}
.chapter-num{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--slate);text-transform:uppercase;margin-bottom:14px;opacity:0;transition:opacity 0.8s}
.chapter-title{font-family:'EB Garamond',serif;font-size:28px;font-weight:300;color:var(--white);line-height:1.25;margin-bottom:12px;opacity:0;transition:opacity 0.8s}
.chapter-body{font-family:'EB Garamond',serif;font-size:13px;font-weight:300;color:var(--slate);line-height:1.65;opacity:0;transition:opacity 0.8s}

/* Stats reveal panel */
#stats-panel{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:200px;z-index:10;opacity:0;transition:opacity 1s}
#stats-panel.show{opacity:1}
.stat-line{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--slate);margin-bottom:16px;overflow:hidden}
.stat-label{letter-spacing:0.2em;font-size:9px;color:var(--slate);opacity:0.6;margin-bottom:4px}
.stat-value{font-family:'EB Garamond',serif;font-size:32px;font-weight:300;color:var(--white);overflow:hidden;white-space:nowrap}
.stat-value.red{color:var(--red)}
.stat-value.green{color:var(--green)}

#ticks{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:10}
.tick{width:24px;height:2px;background:rgba(255,255,255,0.12);transition:background 0.4s}
.tick.active{background:var(--red)}
.tick.done{background:rgba(255,45,90,0.25)}
#replay{position:absolute;top:28px;right:32px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--red);border:1px solid rgba(255,45,90,0.5);background:rgba(255,45,90,0.06);padding:8px 20px;border-radius:20px;cursor:pointer;z-index:10;transition:background 0.2s}
#replay:hover{background:rgba(255,45,90,0.14)}

/* Skip button */
#skip-btn{position:absolute;top:28px;left:32px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:0.2em;color:rgba(139,160,180,0.5);border:1px solid rgba(139,160,180,0.2);background:transparent;padding:8px 16px;border-radius:20px;cursor:pointer;z-index:10;transition:all 0.2s}
#skip-btn:hover{color:var(--slate);border-color:rgba(139,160,180,0.5)}

/* Boot counter */
#boot-counter{position:absolute;bottom:28px;right:32px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--slate);opacity:0.5;z-index:10}

/* Enter button with pulse */
#enter-btn{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.2em;color:var(--green);border:1px solid rgba(93,202,165,0.4);background:rgba(93,202,165,0.06);padding:10px 32px;border-radius:20px;cursor:pointer;z-index:10;opacity:0;transition:opacity 0.8s,background 0.2s;pointer-events:none;position:absolute}
#enter-btn.show{opacity:1;pointer-events:auto;animation:btnPulse 2s ease-in-out infinite}
#enter-btn:hover{background:rgba(93,202,165,0.14)}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(93,202,165,0.4)}50%{box-shadow:0 0 0 12px rgba(93,202,165,0)}}

/* Typing cursor */
.cursor{display:inline-block;width:2px;height:1em;background:var(--white);vertical-align:middle;animation:blink 0.7s step-end infinite;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Glitch effect */
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;opacity:0}
.glitching::before{animation:glitch1 0.15s step-end 3;color:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,0 40%);transform:translateX(-3px)}
.glitching::after{animation:glitch2 0.15s step-end 3;color:var(--green);clip-path:polygon(0 60%,100% 60%,100% 100%,0 100%);transform:translateX(3px)}
@keyframes glitch1{0%,100%{opacity:0}33%{opacity:0.9;transform:translateX(-3px) skewX(-2deg)}66%{opacity:0;transform:translateX(2px)}}
@keyframes glitch2{0%,100%{opacity:0}33%{opacity:0.9;transform:translateX(3px) skewX(2deg)}66%{opacity:0;transform:translateX(-2px)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div id="text-panel">
    <div class="chapter-num" id="ch-num"></div>
    <div class="chapter-title" id="ch-title"></div>
    <div class="chapter-body" id="ch-body"></div>
  </div>

  <!-- Stats reveal panel (chapter 5) -->
  <div id="stats-panel">
    <div class="stat-line">
      <div class="stat-label">TRANSACTIONS ANALYZED</div>
      <div class="stat-value" id="stat-txs">0</div>
    </div>
    <div class="stat-line">
      <div class="stat-label">SUSPICIOUS FLAGGED</div>
      <div class="stat-value red" id="stat-flagged">0</div>
    </div>
    <div class="stat-line">
      <div class="stat-label">LAUNDERING DETECTED</div>
      <div class="stat-value green" id="stat-amount">$0</div>
    </div>
  </div>

  <div id="ticks">
    <div class="tick" id="t0"></div><div class="tick" id="t1"></div>
    <div class="tick" id="t2"></div><div class="tick" id="t3"></div>
    <div class="tick" id="t4"></div><div class="tick" id="t5"></div>
  </div>

  <button id="skip-btn" onclick="skipToEnd()">[ SKIP ]</button>
  <button id="replay">REPLAY</button>
  <div id="boot-counter">SYSTEM BOOT: 00:30</div>
  <button id="enter-btn" style="position:absolute;bottom:80px;left:50%;transform:translateX(-50%)" onclick="window.location.href='/app'">ENTER SYSTEM →</button>
</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, animId, phase = 0, phaseT = 0;
let stars = [], particles = [], nodes = [], edges = [], rings = [], loop_progress = 0;
let dot_pos = 0, dot_t = 0, verdict_alpha = 0;
let bootSeconds = 30, bootInterval;
let statsAnimating = false, statTxs = 0, statFlagged = 0, statAmount = 0;

const CHAPTERS = [
  {num:'01',title:'The darkness\nbefore data',body:'Before the investigation,\nthere is only silence.\nThe network waits.'},
  {num:'02',title:'Data awakens',body:'Thousands of transactions\narrive each second.\nEach one a story.'},
  {num:'03',title:'The web\ntakes shape',body:'Accounts become nodes.\nTransfers become edges.\nA graph emerges.'},
  {num:'04',title:'The mind\nat work',body:'The neural network\npropagates through\neach connection.'},
  {num:'05',title:'A pattern\nemerges',body:'Among 150,000 transactions,\na smurfing ring —\nhidden until now.'},
  {num:'06',title:'The verdict',body:'76 accounts flagged.\nRisk score: 0.94.\nThe hunt is over.'},
];

const LOOP = [4,5,6,7,8,4];
const GREEN = '#5dcaa5', RED = '#ff2d5a', WHITE = '#f0f5fb';

// Typing effect
function typeText(el, text, speed=35, cb){
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  let i = 0;
  const interval = setInterval(()=>{
    if(i < text.length){
      el.insertBefore(document.createTextNode(text[i]), cursor);
      i++;
    } else {
      clearInterval(interval);
      cursor.remove();
      if(cb) cb();
    }
  }, speed);
  return interval;
}

// Glitch effect
function glitchEl(el){
  const text = el.textContent;
  el.setAttribute('data-text', text);
  el.classList.add('glitch','glitching');
  setTimeout(()=>el.classList.remove('glitching'), 500);
}

// Count up animation
function countUp(el, target, duration, prefix='', suffix='', isFloat=false){
  const start = performance.now();
  const startVal = 0;
  function update(now){
    const t = Math.min(1,(now-start)/duration);
    const ease = 1-Math.pow(1-t,3);
    const val = startVal + (target-startVal)*ease;
    if(isFloat) el.textContent = prefix + '$' + (val/1e9).toFixed(2) + 'B';
    else el.textContent = prefix + Math.floor(val).toLocaleString() + suffix;
    if(t<1) requestAnimationFrame(update);
    else el.textContent = isFloat ? prefix+'$'+(target/1e9).toFixed(2)+'B' : prefix+target.toLocaleString()+suffix;
  }
  requestAnimationFrame(update);
}

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W/2; cy = H/2;
}

function initStars(){
  stars = Array.from({length:80},()=>({
    x: cx*0.3 + Math.random()*(W*0.7),
    y: Math.random()*H,
    r: Math.random()*1.2+0.3,
    base: Math.random()*0.5+0.15,
    twinkle: Math.random()*Math.PI*2,
    speed: 0.005+Math.random()*0.015
  }));
}

function initNodes(){
  const r = Math.min(W,H)*0.22;
  nodes = Array.from({length:14},(_, i)=>{
    let angle, dist;
    if(i>=4&&i<=9){
      angle = (i-4)/6*Math.PI*2 - Math.PI/2;
      dist = (i===9) ? r*0.3 : r*0.85;
    } else {
      angle = (i<4?i/4:((i-10)/4))*Math.PI*2 + Math.random()*0.4;
      dist = r*(1.1+Math.random()*0.4);
    }
    return {
      x: cx*1.15 + Math.cos(angle)*dist,
      y: cy + Math.sin(angle)*dist,
      r:0, targetR:6, born:false, alpha:0,
      suspicious: i>=4&&i<=9,
      ring_phase: Math.random()*Math.PI*2
    };
  });
  edges = [
    [0,1],[1,2],[2,3],[3,0],[0,5],[1,6],[2,7],[3,8],
    [4,5],[5,6],[6,7],[7,8],[8,4],[9,4],[9,6],[9,8]
  ];
}

function setChapter(c){
  const data = CHAPTERS[c];
  const num = document.getElementById('ch-num');
  const title = document.getElementById('ch-title');
  const body = document.getElementById('ch-body');
  [num,title,body].forEach(el=>el.style.opacity=0);

  setTimeout(()=>{
    // Chapter number — just set it
    num.textContent = data.num;
    num.style.opacity = 1;

    // Title — type it out
    title.style.opacity = 1;
    title.innerHTML = '';
    const lines = data.title.split('\n');
    typeText(title, lines[0], 40, ()=>{
      if(lines[1]){
        title.appendChild(document.createElement('br'));
        const span = document.createElement('span');
        title.appendChild(span);
        typeText(span, lines[1], 40, ()=>{
          // After title, fade in body
          body.style.opacity = 1;
          body.innerHTML = data.body.replace(/\n/g,'<br>');
          // Glitch title on chapter 5 (verdict)
          if(c === 5) setTimeout(()=>glitchEl(title), 800);
        });
      } else {
        body.style.opacity = 1;
        body.innerHTML = data.body.replace(/\n/g,'<br>');
        if(c === 5) setTimeout(()=>glitchEl(title), 800);
      }
    });

  }, 400);

  document.querySelectorAll('.tick').forEach((t,i)=>{
    t.className='tick'+(i<c?' done':i===c?' active':'');
  });

  // Show stats panel on chapter 4
  if(c === 4){
    const panel = document.getElementById('stats-panel');
    panel.classList.add('show');
    setTimeout(()=>{
      countUp(document.getElementById('stat-txs'), 150000, 2000);
      setTimeout(()=>countUp(document.getElementById('stat-flagged'), 76, 1500), 600);
      setTimeout(()=>countUp(document.getElementById('stat-amount'), 1779060719, 2000, '', '', true), 1200);
    }, 500);
  } else {
    document.getElementById('stats-panel').classList.remove('show');
  }
}

function lerp(a,b,t){return a+(b-a)*t}

function drawStars(dimFactor=1){
  stars.forEach(s=>{
    s.twinkle+=s.speed;
    const a = (s.base+Math.sin(s.twinkle)*0.2)*dimFactor;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(139,160,180,${a})`;
    ctx.fill();
  });
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.y+=p.vy; p.alpha-=0.012;
    if(p.alpha<=0){particles.splice(i,1);continue;}
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(93,202,165,${p.alpha})`;
    ctx.fill();
  }
  if(phase===1&&Math.random()<0.6){
    particles.push({x:cx*0.35+Math.random()*W*0.65,y:-5,r:Math.random()*2+0.5,vy:2+Math.random()*3,alpha:0.7});
  }
}

function drawNodes(suspOnly=false, dimInnocent=false){
  nodes.forEach((n,i)=>{
    if(!n.born) return;
    if(suspOnly&&!n.suspicious) return;
    let alpha = n.alpha;
    if(dimInnocent&&!n.suspicious) alpha*=0.18;
    const col = n.suspicious ? RED : GREEN;
    ctx.beginPath();
    ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.globalAlpha=alpha;
    ctx.fill();
    ctx.globalAlpha=1;
    if(n.suspicious&&dimInnocent){
      const pulse = 0.4+0.35*Math.sin(Date.now()*0.0045+n.ring_phase);
      ctx.beginPath();
      ctx.arc(n.x,n.y,n.r+6*pulse,0,Math.PI*2);
      ctx.strokeStyle=RED;
      ctx.lineWidth=1;
      ctx.globalAlpha=0.4*pulse*alpha;
      ctx.stroke();
      ctx.globalAlpha=1;
    }
  });
}

function drawEdges(dimInnocent=false){
  edges.forEach(([a,b])=>{
    const na=nodes[a],nb=nodes[b];
    if(!na||!nb||!na.born||!nb.born) return;
    const susp = na.suspicious&&nb.suspicious;
    let alpha = Math.min(na.alpha,nb.alpha)*0.5;
    if(dimInnocent&&!susp) alpha*=0.12;
    ctx.beginPath();
    ctx.moveTo(na.x,na.y);
    ctx.lineTo(nb.x,nb.y);
    ctx.strokeStyle = susp&&dimInnocent ? RED : GREEN;
    ctx.lineWidth = susp&&dimInnocent?1.2:0.6;
    ctx.globalAlpha=alpha;
    ctx.stroke();
    ctx.globalAlpha=1;
  });
}

function drawRings(){
  rings.forEach((r,i)=>{
    r.radius+=2.2; r.alpha-=0.018;
    if(r.alpha<=0){rings.splice(i,1);return;}
    const n=nodes[r.node];
    if(!n) return;
    ctx.beginPath();
    ctx.arc(n.x,n.y,r.radius,0,Math.PI*2);
    ctx.strokeStyle=GREEN;
    ctx.lineWidth=0.8;
    ctx.globalAlpha=r.alpha;
    ctx.stroke();
    ctx.globalAlpha=1;
  });
}

function drawSpotlight(alpha){
  const cx2=cx*1.15, cy2=cy;
  ctx.save();
  ctx.globalAlpha=alpha*0.55;
  ctx.beginPath();
  ctx.arc(cx2,cy2,Math.min(W,H)*0.28,0,Math.PI*2);
  ctx.fillStyle='rgba(255,45,90,0.06)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx2,cy2,Math.min(W,H)*0.28,0,Math.PI*2);
  ctx.strokeStyle=RED;
  ctx.lineWidth=0.8;
  ctx.globalAlpha=alpha*0.3;
  ctx.stroke();
  ctx.restore();
}

function drawTravellingDot(){
  if(dot_pos>=LOOP.length) return;
  const a=nodes[LOOP[Math.floor(dot_pos)%LOOP.length]];
  const b=nodes[LOOP[Math.ceil(dot_pos)%LOOP.length]];
  if(!a||!b) return;
  const t=dot_pos%1;
  const x=lerp(a.x,b.x,t), y=lerp(a.y,b.y,t);
  ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fillStyle=RED; ctx.globalAlpha=0.95; ctx.fill(); ctx.globalAlpha=1;
  for(let i=1;i<=6;i++){
    const tt=Math.max(0,t-i*0.06);
    const tx=lerp(a.x,b.x,tt),ty=lerp(a.y,b.y,tt);
    ctx.beginPath(); ctx.arc(tx,ty,2.5,0,Math.PI*2);
    ctx.fillStyle=RED; ctx.globalAlpha=0.12*(7-i); ctx.fill(); ctx.globalAlpha=1;
  }
}

function drawVerdict(alpha){
  if(alpha<=0) return;
  const vx=cx*1.15+Math.min(W,H)*0.2, vy=cy-30;
  ctx.globalAlpha=alpha;
  ctx.font=`500 10px 'Share Tech Mono'`;
  ctx.fillStyle=RED;
  ctx.fillText('CLUSTER 47 · FLAGGED',vx,vy);
  ctx.beginPath(); ctx.moveTo(vx,vy+10); ctx.lineTo(vx+180,vy+10);
  ctx.strokeStyle=RED; ctx.lineWidth=0.8; ctx.stroke();
  ctx.font=`300 52px 'EB Garamond'`;
  ctx.fillStyle=WHITE;
  ctx.fillText('0.94',vx,vy+68);
  ctx.font=`400 10px 'Share Tech Mono'`;
  ctx.fillStyle=RED;
  ctx.fillText('RISK SCORE',vx,vy+88);
  ctx.globalAlpha=1;
}

// Boot counter
function startBootCounter(){
  clearInterval(bootInterval);
  bootSeconds = 30;
  const el = document.getElementById('boot-counter');
  el.textContent = 'SYSTEM BOOT: 00:30';
  bootInterval = setInterval(()=>{
    bootSeconds--;
    if(bootSeconds <= 0){
      clearInterval(bootInterval);
      el.textContent = 'SYSTEM READY';
      el.style.color = 'var(--green)';
    } else {
      el.textContent = `SYSTEM BOOT: 00:${String(bootSeconds).padStart(2,'0')}`;
    }
  }, 1000);
}

let bornCount=0, bornTimer=0;
let chapterDurations=[5000,4000,5000,5000,6000,7000];
let chapterStart=0, currentChapter=-1;

function startChapter(c){
  currentChapter=c;
  chapterStart=performance.now();
  setChapter(c);
  if(c===2){bornCount=0;bornTimer=0;}
  if(c===3){rings=[];}
  if(c===4){dot_pos=0;dot_t=0;loop_progress=0;}
  if(c===5){verdict_alpha=0;}
}

function tick(now){
  ctx.clearRect(0,0,W,H);
  const elapsed=now-chapterStart;
  const dur=chapterDurations[currentChapter]||5000;

  if(currentChapter===0){
    drawStars(1);
  }
  else if(currentChapter===1){
    drawStars(0.3);
    drawParticles();
  }
  else if(currentChapter===2){
    drawStars(0.2);
    if(bornCount<nodes.length){
      bornTimer+=16;
      if(bornTimer>55){
        bornTimer=0;
        const idx=bornCount++;
        nodes[idx].born=true;
      }
    }
    nodes.forEach(n=>{
      if(n.born&&n.r<n.targetR) n.r=Math.min(n.targetR,n.r+0.8);
      if(n.born&&n.alpha<1) n.alpha=Math.min(1,n.alpha+0.06);
    });
    drawEdges();
    drawNodes();
  }
  else if(currentChapter===3){
    drawStars(0.15);
    nodes.forEach(n=>{if(n.born&&n.alpha<1){n.alpha=1;n.r=n.targetR;}});
    if(Math.random()<0.04){
      const ni=Math.floor(Math.random()*nodes.length);
      if(nodes[ni].born) rings.push({node:ni,radius:nodes[ni].r,alpha:0.6});
    }
    drawEdges();
    drawRings();
    drawNodes();
  }
  else if(currentChapter===4){
    drawStars(0.1);
    const spotA=Math.min(1,elapsed/1000);
    drawSpotlight(spotA);
    drawEdges(true);
    drawNodes(false,true);
    dot_t+=0.016;
    if(dot_t>0.02){dot_t=0;dot_pos+=0.07;}
    if(dot_pos>=LOOP.length*2) dot_pos=0;
    drawTravellingDot();
  }
  else if(currentChapter===5){
    drawStars(0.1);
    drawSpotlight(1);
    drawEdges(true);
    drawNodes(false,true);
    verdict_alpha=Math.min(1,(elapsed-800)/1200);
    drawVerdict(verdict_alpha);
    const hub=nodes[9];
    if(hub){
      const p=0.5+0.4*Math.sin(now*0.0022);
      ctx.beginPath();
      ctx.arc(hub.x,hub.y,hub.r+14*p,0,Math.PI*2);
      ctx.strokeStyle=RED; ctx.lineWidth=1.2;
      ctx.globalAlpha=0.35*p; ctx.stroke(); ctx.globalAlpha=1;
    }
  }

  if(elapsed>dur&&currentChapter<5){
    startChapter(currentChapter+1);
  }
  if(currentChapter===5&&elapsed>dur){
    document.getElementById('enter-btn').classList.add('show');
  }

  animId=requestAnimationFrame(tick);
}

function skipToEnd(){
  cancelAnimationFrame(animId);
  particles=[];rings=[];dot_pos=0;verdict_alpha=0;
  nodes.forEach(n=>{n.born=true;n.r=n.targetR;n.alpha=1;});
  startChapter(5);
  clearInterval(bootInterval);
  document.getElementById('boot-counter').textContent='SYSTEM READY';
  document.getElementById('boot-counter').style.color='var(--green)';
  animId=requestAnimationFrame(tick);
}

function start(){
  cancelAnimationFrame(animId);
  particles=[];rings=[];dot_pos=0;verdict_alpha=0;
  bornCount=0;bornTimer=0;
  initNodes();
  document.getElementById('enter-btn').classList.remove('show');
  document.getElementById('stats-panel').classList.remove('show');
  document.getElementById('boot-counter').style.color='var(--slate)';
  startBootCounter();
  startChapter(0);
  animId=requestAnimationFrame(tick);
}

document.getElementById('replay').addEventListener('click',start);
window.addEventListener('resize',()=>{resize();initStars();});
resize();
initStars();
initNodes();
start();
</script>
</body>
</html>
